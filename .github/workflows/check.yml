name: check

# The gate this repo already declares, run on the changes it already accepts.
# `mise run ci` is the type-check and the test suite (.mise.toml), and CI calls
# *that task* rather than a re-spelling of its steps — a workflow that lists the
# commands itself is a second gate that drifts from the first.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The gate reads the tree and reports; it writes nothing.
permissions:
  contents: read

# A second push supersedes the first — there is nothing to learn from a run
# against a commit that is already history.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain pinned in .mise.toml (bun 1) and puts `mise` and
      # the tools it manages on PATH, so the runner runs the same versions a
      # contributor does. One job, no matrix: the library imports `bun:sqlite`
      # and targets one runtime.
      - uses: jdx/mise-action@v4

      # `--frozen-lockfile` so a dependency cannot drift under CI: a run that
      # silently resolved a different tree would be green about something other
      # than the commit. Zod is a peer dependency, and this installs the dev
      # copies the suite parses against — both declared majors, the older one
      # under the `zod3` alias.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and tests
        run: mise run ci
